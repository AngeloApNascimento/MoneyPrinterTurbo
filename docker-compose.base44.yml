x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      DOCKER_BUILD_MIRROR: default
      PIP_USE_OFFICIAL: "1"
  volumes:
    - ./:/MoneyPrinterTurbo
  environment:
    - BASE44_PREVIEW_MODE
  restart: on-failure

services:
  webui:
    <<: *app
    labels:
      base44.project: WebUI
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:8501"
    command: ["streamlit", "run", "./webui/Main.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.runOnSave=true", "--server.fileWatcherType=poll", "--server.enableCORS=false", "--server.enableXsrfProtection=false", "--browser.gatherUsageStats=False", "--client.toolbarMode=minimal", "--logger.hideWelcomeMessage=True", "--server.showEmailPrompt=False"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 40s
  api:
    <<: *app
    labels:
      base44.project: API
      base44.kind: api
      base44.port: "8080"
      base44.docs: /docs
    ports:
      - "8080:8080"
    command: ["uvicorn", "app.asgi:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/docs',timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 40s
